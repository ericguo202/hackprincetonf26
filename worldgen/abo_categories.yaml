    clearance_front_m: 0.0
  play_equipment:
    product_types: [SPORTING_GOODS, FITNESS_BENCH]
    include: "batting tee|bench"
    count: 2
    tags: [playroom, yard, play]
    placement: free
    clearance_front_m: 0.5
  canopy_tent:
    product_types: [FREESTANDING_SHELTER]
    count: 1
    tags: [yard, play, cover]
    placement: free
    clearance_front_m: 0.0
