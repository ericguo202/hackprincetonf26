# ABO product_type -> our furniture categories (AGENTS.md section 7.6, stage 2).
# Built from the real product_type counts of ABO listings that have a 3dmodel_id
# (run `uv run python -m worldgen.sources.abo types` to reprint them).
#
# Per category:
#   product_types  ABO product_type values to consider
#   include        regex on the English item_name (case-insensitive); optional
#   exclude        regex that rejects an item; optional
#   height_m       [min, max] on the model's Y extent (meters); optional
#   footprint_m    [min, max] on the larger of the X/Z extents; optional
#   count          how many to keep (3 to 8; living room gets the most)
#   tags, placement, clearance_front_m   copied into the selection for build_catalog
#
# Not available as ABO 3D models (checked by name and keyword over all 7,953 models):
#   TV set, refrigerator / kitchen appliances, crib, changing table, soccer goal.
#   Fill these from Poly Haven (CC0) or KayKit / Kenney (CC0).

categories:
  # ---- living room (demo) ----
  sofa:
    product_types: [SOFA]
    exclude: "sectional|sleeper|futon|cover|slipcover|loveseat|settee|chaise|ottoman|outdoor|patio"
    footprint_m: [1.6, 2.6]
    count: 8
    tags: [living_room, seating, movie_night, cover]
    placement: wall
    clearance_front_m: 0.75
  sectional:
    product_types: [SOFA, OUTDOOR_LIVING]
    include: "sectional"
    exclude: "cover|slipcover|outdoor|patio|wicker"
    count: 5
    tags: [living_room, seating, movie_night, cover]
    placement: corner
    clearance_front_m: 0.75
  loveseat:
    product_types: [SOFA]
    include: "loveseat|settee"
    exclude: "cover|outdoor|patio"
    count: 4
    tags: [living_room, seating, cover]
    placement: wall
    clearance_front_m: 0.75
  armchair:
    product_types: [CHAIR, SOFA, HOME_FURNITURE_AND_DECOR]
    include: "accent chair|armchair|club chair|lounge chair|recliner|swivel chair"
    exclude: "office|desk|gaming|dining|outdoor|patio|chaise|cover|rocking|rocker"
    count: 7
    tags: [living_room, seating, cover]
    placement: free
    clearance_front_m: 0.6
  coffee_table:
    product_types: [TABLE, HOME_FURNITURE_AND_DECOR, FURNITURE]
    include: "coffee table|cocktail table"
    exclude: "stool"
    count: 6
    tags: [living_room, table, movie_night]
    placement: center
    clearance_front_m: 0.45
  side_table:
    product_types: [TABLE]
    include: "side table|end table|accent table"
    count: 4
    tags: [living_room, table]
    placement: beside
    clearance_front_m: 0.0
  tv_stand:
    product_types: [HOME_FURNITURE_AND_DECOR, FLAT_SCREEN_DISPLAY_MOUNT, CABINET, TABLE]
    include: "tv stand|tv cabinet|tv console|media console|media stand|tv board|tv unit"
    exclude: "mount|ceiling|arm"
    count: 6
    tags: [living_room, storage, movie_night, cover]
    placement: wall
    clearance_front_m: 0.9
  rug:
    product_types: [RUG]
    exclude: "runner|doormat|door mat|mat,|bath"
    footprint_m: [1.4, 4.0]
    count: 6
    tags: [living_room, bedroom, floor]
    placement: center
    clearance_front_m: 0.0
  bookshelf:
    product_types: [SHELF, CABINET, HOME_FURNITURE_AND_DECOR]
    include: "bookcase|bookshelf|shelving unit|shelf"
    exclude: "wall shelf|floating|wall-mounted|wall mounted|toy|children|kids|shoe|bathroom|ladder shelf mount"
    height_m: [1.0, 2.2]
    count: 6
    tags: [living_room, office, storage, cover]
    placement: wall
    clearance_front_m: 0.6
  floor_lamp:
    product_types: [LAMP]
    include: "floor lamp|arc lamp|torchiere"
    height_m: [1.2, 2.2]
    count: 5
    tags: [living_room, bedroom, lighting]
    placement: corner
    clearance_front_m: 0.0
  table_lamp:
    product_types: [LAMP]
    include: "table lamp|desk lamp|bedside lamp"
    height_m: [0.2, 0.9]
    count: 4
    tags: [bedroom, office, lighting]
    placement: on_surface
    clearance_front_m: 0.0
  ottoman:
    product_types: [OTTOMAN]
    exclude: "cover"
    count: 4
    tags: [living_room, seating]
    placement: free
    clearance_front_m: 0.0
  plant:
    product_types: [PLANTER, ARTIFICIAL_PLANT]
    exclude: "hanging|wall"
    height_m: [0.3, 2.0]
    count: 4
    tags: [living_room, decor]
    placement: corner
    clearance_front_m: 0.0

  # ---- bedroom ----
  bed:
    product_types: [BED, BED_FRAME, STORAGE_BOX, HEADBOARD]
    include: "bed"
    exclude: "headboard only|underbed|under bed|bed rail|bedding|bed skirt|sofa|dog|pet|canopy|cover|nightstand|bedside"
    footprint_m: [1.8, 2.6]
    height_m: [0.25, 1.8]
    count: 8
    tags: [bedroom, primary_bedroom, sleeping, cover]
    placement: wall
    clearance_front_m: 0.6
  nightstand:
    product_types: [HOME_FURNITURE_AND_DECOR, TABLE, CABINET, STORAGE_BOX, DRESSER]
    include: "nightstand|night stand|bedside table|bedside cabinet"
    count: 5
    tags: [bedroom, storage]
    placement: beside
    clearance_front_m: 0.4
  dresser:
