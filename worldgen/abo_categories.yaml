    count: 5
    tags: [office, bedroom, table]
    placement: wall
    clearance_front_m: 0.9
  office_chair:
    product_types: [CHAIR]
    include: "office chair|desk chair|task chair|gaming chair|executive chair"
    count: 4
    tags: [office, seating]
    placement: free
    clearance_front_m: 0.0

  # ---- dining / kitchen ----
  dining_table:
    product_types: [TABLE, HOME_FURNITURE_AND_DECOR]
    include: "dining table|kitchen table|dining set|breakfast table"
    exclude: "kid|chair cover|bench only"
    count: 5
    tags: [dining_room, kitchen, table, cover]
    placement: center
    clearance_front_m: 0.9
  dining_chair:
    product_types: [CHAIR, HOME_FURNITURE_AND_DECOR]
    include: "dining chair|kitchen chair|dining room chair|side chair"
    exclude: "kid|cover|outdoor|patio"
    count: 5
    tags: [dining_room, kitchen, seating]
    placement: beside
    clearance_front_m: 0.0
  bar_stool:
    product_types: [STOOL_SEATING]
    include: "bar|counter|island"
    count: 4
    tags: [kitchen, seating]
    placement: beside
    clearance_front_m: 0.0
  kitchen_island:
    product_types: [CABINET, HOME_FURNITURE_AND_DECOR, TABLE]
    include: "kitchen island|kitchen cart|island|bar cart"
    count: 3
    tags: [kitchen, storage, cover]
    placement: center
    clearance_front_m: 0.9
  bench:
    product_types: [BENCH]
    count: 3
    tags: [dining_room, hallway, seating]
    placement: wall
    clearance_front_m: 0.4

  # ---- nursery / kids / play ----
  rocking_chair:
    product_types: [CHAIR, HOME_FURNITURE_AND_DECOR]
    include: "rocking chair|glider|rocker"
    exclude: "gaming|office"
    count: 4
    tags: [nursery, living_room, seating]
    placement: corner
    clearance_front_m: 0.6
  toy_storage:
    product_types: [HOME_FURNITURE_AND_DECOR, STORAGE_BOX, SHELF, CABINET]
    include: "toy storage|toy|children's|storage cube|storage cubes|cube organizer"
    exclude: "jewelry|decorative|stoneware|tv console"
    count: 4
    tags: [nursery, playroom, storage]
    placement: wall
    clearance_front_m: 0.5
  kids_table:
    product_types: [HOME_FURNITURE_AND_DECOR, TABLE, DESK]
    include: "kid|kiddie|children"
    exclude: "bookcase|toy storage|chairs?,? .*pack|chair set"
    count: 3
    tags: [playroom, nursery, table]
    placement: center
    clearance_front_m: 0.5
  kids_chair:
    product_types: [HOME_FURNITURE_AND_DECOR, CHAIR]
    include: "kids chair|kid chair|kiddie chair"
    count: 3
    tags: [playroom, nursery, seating]
    placement: free
    clearance_front_m: 0.0
  play_mat:
    product_types: [EXERCISE_MAT]
    count: 3
