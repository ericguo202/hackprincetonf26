# Render blueprint (AGENTS.md sections 5 and 8).
# Region is immutable. Omitting it defaults to oregon; pin ohio (US East).
# Static sites have no region (global CDN).
#
# After the first Blueprint apply, set these in the dashboard (sync: false):
#   agent: MODEL, ANTHROPIC_API_KEY or OPENROUTER_API_KEY, LANGSMITH_API_KEY
#   game + agent: PACK_BASE_URL (S3 or CDN of worldgen publish)
#   web: VITE_PACK_BASE_URL (same URL), VITE_MATTERPORT_SDK_KEY
# Then redeploy web so Vite bakes the pack URL into the bundle.
# VITE_GAME_URL / VITE_AGENT_URL are filled from each service's public https URL
# (Colyseus 0.18 accepts https:// and upgrades to wss).
# game: exactly ONE instance, never autoscale. No deploys during judging.
projects:
  - name: built-world-sandbox
    environments:
      - name: production
        services:
          - type: web
            name: game
            runtime: node
            plan: starter
            region: ohio
            numInstances: 1
            maxShutdownDelaySeconds: 45
            rootDir: apps/game
            buildCommand: npm ci
            startCommand: npm start
            healthCheckPath: /health
            previews:
              generation: manual
            buildFilter:
              paths: ["apps/game/**", "contracts/**"]
            envVars:
              - key: NODE_VERSION
                value: "22.22.0"
              - key: NODE_ENV
                value: production
              - key: GAME_INTERNAL_SECRET
                generateValue: true
              - key: PACK_BASE_URL
                sync: false

          - type: web
            name: agent
            runtime: python
            plan: starter
            region: ohio
            rootDir: apps/agent
            # uv.lock in this rootDir makes Render provide uv; do not pip-install a second copy.
            buildCommand: uv sync --frozen --no-dev
            startCommand: uv run --no-dev uvicorn api.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health
            previews:
              generation: manual
            buildFilter:
              paths: ["apps/agent/**", "contracts/**"]
            envVars:
              - key: PYTHON_VERSION
                value: "3.12.10"
              - key: UV_VERSION
                value: "0.13.7"
              - key: GAME_HOSTPORT
                fromService: { type: web, name: game, property: hostport }
              - key: GAME_INTERNAL_SECRET
                fromService: { type: web, name: game, envVarKey: GAME_INTERNAL_SECRET }
              - key: MODEL
                sync: false
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: OPENROUTER_API_KEY
                sync: false
              - key: LANGSMITH_TRACING
                value: "true"
              - key: LANGSMITH_API_KEY
                sync: false
              - key: LANGSMITH_ENDPOINT
                value: https://api.smith.langchain.com
              - key: LANGSMITH_AGENT_ID
                value: hackpton-realestate
              - key: LANGSMITH_AGENT_ENVIRONMENT
                value: production
              - key: PACK_BASE_URL
                sync: false
              - key: PACK_VERSION
                value: "1"
              - key: FURNITURE_VERSION
                value: "1"
              - key: BLOCK_ID
                value: hou_navidad_01
              - key: USE_FIXTURES
                value: "0"
              - key: MOCK_AGENT
                value: "0"
              - key: FAKE_PLACEMENT
                value: "0"
              - key: HITL
                value: "0"

          - type: web
            name: web
            runtime: static
            rootDir: apps/web
            buildCommand: npm i -g pnpm@12.18.0 && pnpm install --frozen-lockfile && pnpm build
            staticPublishPath: dist
            previews:
              generation: manual
            buildFilter:
              paths: ["apps/web/**", "contracts/**"]
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: "22.22.0"
              - key: VITE_GAME_URL
                fromService: { type: web, name: game, envVarKey: RENDER_EXTERNAL_URL }
              - key: VITE_AGENT_URL
                fromService: { type: web, name: agent, envVarKey: RENDER_EXTERNAL_URL }
              - key: VITE_PACK_BASE_URL
                sync: false
              - key: VITE_MATTERPORT_SDK_KEY
                sync: false
              - key: VITE_SOLO
                value: "0"
