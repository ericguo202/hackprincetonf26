    count: 5
    tags: [bedroom, storage, cover]
    placement: wall
    clearance_front_m: 0.75
  wardrobe:
    product_types: [CABINET, DESK, SHELF]
    include: "wardrobe"
    exclude: "panel"
    count: 3
    tags: [bedroom, storage, cover]
    placement: wall
    clearance_front_m: 0.75

  # ---- office ----
  desk:
    product_types: [DESK, TABLE]
    include: "desk"
    exclude: "wardrobe|kid|children|lamp|organizer|converter|riser"
